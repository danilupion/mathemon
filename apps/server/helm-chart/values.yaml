# Server service values
replicaCount: 1
image:
  repository: mathemon/server
  tag: latest
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 3200

config: |
  {
    "environment": "development",
    "url": "http://localhost:3200",
    "server": {
      "bodyParserLimits": {
        "json": "5mb"
      },
      "port": 3200
    },
    "smtp": {
      "host": "smtp.ethereal.email",
      "port": 587,
      "secure": false,
      "auth": {
        "user": "giuseppe.denesik0@ethereal.email",
        "pass": "tNamhcx3PpNyvWzd5U"
      }
    },
    "settings": {
      "singleUseToken": {
        "expiresIn": 7200
      },
      "pokemon": {
        "generations": [ 1 ]
      },
      "quiz": {
        "size": 20
      },
      "pokedex": {
        "pageSize": 30
      }
    },
    "auth": {
      "jwt": {
        "secret": "RANDOM STRING, CHANGE ME",
        "expiration": "7d"
      },
      "google": {
        "clientId": "CLIENT ID",
        "clientSecret": "CLIENT SECRET"
      },
      "facebook": {
        "clientId": "CLIENT ID",
        "clientSecret": "CLIENT SECRET"
      }
    },
    "mongodb": {
      "host": "127.0.0.1",
      "port": 27017,
      "database": "mathemon"
    }
  }

# Gateway API HTTPRoute (the chart's only exposure mechanism since 1.0.0;
# the Ingress template was removed with the ingress-nginx retirement).
route:
  enabled: false
  # Gateway(s) to attach to, e.g.:
  #   - name: gateway-public
  #     namespace: gateway-public
  parentRefs: []
  hostnames: []
  annotations: {}

# When set, mount the server config (production.json) from this pre-existing
# Secret instead of rendering .Values.config into a ConfigMap - use for
# deployments whose config carries credentials.
existingConfigSecret: ''
